name: Build Bukvar Huawei APK

on:
  push:
    branches: ["codex/bukvar-huawei-apk"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore and adapt for Huawei
        run: |
          cat bukvar-build/src.part* | base64 -d > /tmp/bukvar-src.tar.xz
          tar -xJf /tmp/bukvar-src.tar.xz
          python3 - <<'PY'
          from pathlib import Path
          g=Path('bukvar-android/app/build.gradle')
          s=g.read_text()
          s=s.replace('minSdk 26','minSdk 23').replace('versionCode 1','versionCode 2').replace("versionName '0.3.0'", "versionName '0.3.1-huawei'")
          g.write_text(s)
          p=Path('bukvar-android/app/src/main/java/ru/ratunov/bukvar/MainActivity.java')
          s=p.read_text()
          old='''        w.setStatusBarColor(Color.TRANSPARENT);\n        w.setNavigationBarColor(Color.TRANSPARENT);\n        if (Build.VERSION.SDK_INT >= 30) {'''
          new='''        String maker = Build.MANUFACTURER == null ? "" : Build.MANUFACTURER.toLowerCase();\n        String brand = Build.BRAND == null ? "" : Build.BRAND.toLowerCase();\n        boolean huawei = maker.contains("huawei") || maker.contains("honor") || brand.contains("huawei") || brand.contains("honor");\n        // Older EMUI/HarmonyOS Android-compatible firmware can reserve system-bar space\n        // even when legacy immersive flags report otherwise. Keep a stable content area there.\n        if (huawei && Build.VERSION.SDK_INT < 30) {\n            w.setStatusBarColor(Color.rgb(246, 244, 234));\n            w.setNavigationBarColor(Color.rgb(246, 244, 234));\n            w.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);\n            return;\n        }\n        w.setStatusBarColor(Color.TRANSPARENT);\n        w.setNavigationBarColor(Color.TRANSPARENT);\n        if (Build.VERSION.SDK_INT >= 30) {'''
          if old not in s: raise SystemExit('edge-to-edge patch anchor missing')
          p.write_text(s.replace(old,new))
          PY
          test -f bukvar-android/app/src/main/assets/index.html

      - name: Install Android API 36
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" /usr/local/lib/android/sdk -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APKs
        working-directory: bukvar-android
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify APK package and hashes
        run: |
          DEBUG=bukvar-android/app/build/outputs/apk/debug/app-debug.apk
          RELEASE=bukvar-android/app/build/outputs/apk/release/app-release.apk
          test -s "$DEBUG" && test -s "$RELEASE"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" /usr/local/lib/android/sdk -type f -path '*/build-tools/36.0.0/aapt' 2>/dev/null | head -n 1)"
          "$AAPT" dump badging "$DEBUG" | head -n 3
          sha256sum "$DEBUG" "$RELEASE" | tee apk-sha256-huawei.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: bukvar-huawei-apk
          path: |
            bukvar-android/app/build/outputs/apk/debug/app-debug.apk
            bukvar-android/app/build/outputs/apk/release/app-release.apk
            apk-sha256-huawei.txt
          if-no-files-found: error
          retention-days: 7
