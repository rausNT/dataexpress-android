name: Bukvar Native - build and device tests
on:
  push:
    branches: [codex/bukvar-native]
    paths: ['bukvar-native/**', '.github/workflows/bukvar-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bukvar-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build native release and unit tests
        working-directory: bukvar-native
        run: |
          python3 prepare.py
          gradle :app:testReleaseUnitTest :app:assembleRelease --stacktrace
      - name: Verify release and preserve source
        run: |
          mkdir -p deliverables
          cp bukvar-native/app/build/outputs/apk/release/app-release.apk deliverables/Bukvar-Native.apk
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs deliverables/Bukvar-Native.apk | tee deliverables/signature.txt
          "$TOOLS/aapt" dump badging deliverables/Bukvar-Native.apk > deliverables/package.txt
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          apk=Path('deliverables/Bukvar-Native.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert not any(n.endswith(('.html','.js','.css')) for n in z.namelist())
              assert b'Landroid/webkit/WebView;' not in z.read('classes.dex')
          with zipfile.ZipFile('deliverables/Bukvar-Native.zip','w',zipfile.ZIP_DEFLATED) as z:z.write(apk,apk.name)
          with zipfile.ZipFile('deliverables/Bukvar-Native.zip') as z:assert z.read(apk.name)==apk.read_bytes()
          Path('deliverables/SHA256.txt').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'  '+str(p.stat().st_size)+' bytes' for p in (apk,Path('deliverables/Bukvar-Native.zip')))+'\n')
          with zipfile.ZipFile('deliverables/Bukvar-Native-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in Path('bukvar-native').rglob('*'):
                  if p.is_file() and not any(s in p.parts for s in ('build','.gradle')):z.write(p)
              z.write('.github/workflows/bukvar-native.yml','bukvar-native/.github/workflows/bukvar-native.yml')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bukvar-native-build
          path: |
            deliverables/
            bukvar-native/app/build/test-results/testReleaseUnitTest/
          retention-days: 14
  devices:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 23
            target: default
          - api: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bukvar-native-build
          path: build-artifact
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise real APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          ram-size: 2048M
          disk-size: 4G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 bukvar-native/tools/smoke.py build-artifact/deliverables/Bukvar-Native.apk
      - name: Preserve actual device screenshots and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bukvar-native-device-api-${{ matrix.api }}
          path: device-report/
          if-no-files-found: warn
          retention-days: 14
