name: Build DataExpress Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout DataExpress Android
        uses: actions/checkout@v4

      - name: Checkout pinned Winlator source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: ca3d735a60d653a787daf16d14fafef28d9c2c23
          path: winlator

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android CMake 3.22.1
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "cmake;3.22.1"

      - name: Apply DataExpress overlay
        shell: bash
        run: |
          set -euo pipefail
          if [ -x scripts/apply-winlator-overlay.sh ]; then
            scripts/apply-winlator-overlay.sh "$GITHUB_WORKSPACE/winlator"
          elif [ -d overlay ]; then
            cp -a overlay/. winlator/
          fi

      - name: Patch pinned Winlator native build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("winlator/app/src/main/cpp/gladiorenderer/src/arb_program.c")
          text = source.read_text()
          old = """                                if (IntArray_indexOf(&asmSource->genericAttribs, index) == -1) IntArray_add(&asmSource->genericAttribs, index);"""
          new = """                                bool hasGenericAttrib = false;
                                for (int attribIndex = 0; attribIndex < asmSource->genericAttribs.size; attribIndex++) {
                                    if (asmSource->genericAttribs.values[attribIndex] == index) {
                                        hasGenericAttrib = true;
                                        break;
                                    }
                                }
                                if (!hasGenericAttrib) IntArray_add(&asmSource->genericAttribs, index);"""
          if old not in text:
              raise SystemExit("Expected IntArray_indexOf call not found")
          source.write_text(text.replace(old, new, 1))
          PY

      - name: Make Gradle executable
        run: chmod +x winlator/gradlew

      - name: Build debug APK
        working-directory: winlator
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find winlator -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/DataExpress-Android-debug.apk
          sha256sum dist/DataExpress-Android-debug.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataExpress-Android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
