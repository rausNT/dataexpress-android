name: Build DataExpress Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout DataExpress Android
        uses: actions/checkout@v4

      - name: Checkout pinned Winlator source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: ca3d735a60d653a787daf16d14fafef28d9c2c23
          path: winlator

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android CMake 3.22.1
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmake;3.22.1'

      - name: Apply DataExpress overlay
        shell: bash
        run: |
          set -euo pipefail
          if [ -x scripts/apply-winlator-overlay.sh ]; then
            scripts/apply-winlator-overlay.sh "$GITHUB_WORKSPACE/winlator"
          elif [ -d overlay ]; then
            cp -a overlay/. winlator/
          fi

      - name: Patch pinned Winlator source
        run: python3 scripts/patch-winlator-source.py winlator

      - name: Make Gradle executable
        run: chmod +x winlator/gradlew

      - name: Build debug APK
        working-directory: winlator
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find winlator -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/DataExpress-Android-debug.apk
          sha256sum dist/DataExpress-Android-debug.apk > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataExpress-Android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
