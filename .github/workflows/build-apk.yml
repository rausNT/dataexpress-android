name: Build DataExpress Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dataexpress:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout DataExpress Android
        uses: actions/checkout@v4

      - name: Checkout pinned DataExpress source
        uses: actions/checkout@v4
        with:
          repository: dxbit/dataexpress
          ref: 89523b3125a5bda55aa7aca7232c8773913fed99
          path: upstream/dataexpress

      - name: Checkout pinned DataExpress dependencies
        uses: actions/checkout@v4
        with:
          repository: dxbit/dataexpress-depend
          ref: 179545a5c4e18a1c4468656980984024b7228ccb
          path: upstream/dataexpress-depend

      - name: Install Lazarus 4.6 and FPC 3.2.2 (Win32)
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'lazarus-4.6-fpc-3.2.2-win32.exe'
          $lazarusRoot = Join-Path $env:RUNNER_TEMP 'lazarus'
          $url = 'https://download.lazarus-ide.org/Lazarus%20Windows%2032%20bits/Lazarus%204.6/lazarus-4.6-fpc-3.2.2-win32.exe'
          $expectedMd5 = 'B9728418A8FEBD934057861DF8550CFA'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $actualMd5 = (Get-FileHash -LiteralPath $installer -Algorithm MD5).Hash
          if ($actualMd5 -ne $expectedMd5) { throw "Lazarus checksum mismatch: $actualMd5" }
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$lazarusRoot"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Lazarus installer failed: $($process.ExitCode)" }

      - name: Build and stage DataExpress Win32 runtime
        shell: pwsh
        run: |
          ./scripts/build-dataexpress-windows.ps1 `
            -LazarusRoot (Join-Path $env:RUNNER_TEMP 'lazarus') `
            -SourceRoot (Join-Path $PWD 'upstream/dataexpress') `
            -ComponentsRoot (Join-Path $PWD 'upstream/dataexpress-depend') `
            -OutputRoot (Join-Path $PWD 'build/runtime/dataexpress') `
            -PrimaryConfigPath (Join-Path $env:RUNNER_TEMP 'lazarus-config')
          python scripts/verify-runtime-payload.py build/runtime/dataexpress `
            --source-revision 89523b3125a5bda55aa7aca7232c8773913fed99 `
            --manifest build/runtime/dataexpress-manifest.json
          Compress-Archive -Path build/runtime/dataexpress/* `
            -DestinationPath build/runtime/dataexpress-payload.zip

      - name: Upload DataExpress runtime
        uses: actions/upload-artifact@v4
        with:
          name: dataexpress-win32-runtime
          path: |
            build/runtime/dataexpress-payload.zip
            build/runtime/dataexpress-manifest.json
          if-no-files-found: error
          retention-days: 14

  build:
    needs: build-dataexpress
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout DataExpress Android
        uses: actions/checkout@v4

      - name: Checkout pinned Winlator source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: ca3d735a60d653a787daf16d14fafef28d9c2c23
          path: winlator

      - name: Download DataExpress runtime
        uses: actions/download-artifact@v4
        with:
          name: dataexpress-win32-runtime
          path: build/runtime

      - name: Download pinned official training database
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download demo-assets-v1 \
            --repo "${{ github.repository }}" \
            --pattern DEMO_DB.DXDB.zip \
            --dir build/runtime
          echo '9b75e4220beba697fa7c60f6c2d9fe913bf1e57491ce37557c1cb983152046f6  build/runtime/DEMO_DB.DXDB.zip' | sha256sum --check

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android CMake 3.22.1
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'cmake;3.22.1'

      - name: Apply DataExpress overlay
        shell: bash
        run: |
          set -euo pipefail
          if [ -x scripts/apply-winlator-overlay.sh ]; then
            scripts/apply-winlator-overlay.sh "$GITHUB_WORKSPACE/winlator"
          elif [ -d overlay ]; then
            cp -a overlay/. winlator/
          fi
          mkdir -p winlator/app/src/main/assets/dataexpress
          cp build/runtime/dataexpress-payload.zip winlator/app/src/main/assets/dataexpress/payload.zip
          cp build/runtime/dataexpress-manifest.json winlator/app/src/main/assets/dataexpress/manifest.json
          cp build/runtime/DEMO_DB.DXDB.zip winlator/app/src/main/assets/dataexpress/demo-database.zip

      - name: Test Winlator patcher
        run: python3 -m unittest discover -s tests -v

      - name: Patch pinned Winlator source
        run: python3 scripts/patch-winlator-source.py winlator

      - name: Make Gradle executable
        run: chmod +x winlator/gradlew

      - name: Build debug APK
        working-directory: winlator
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find winlator -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" dist/DataExpress-Android-debug.apk
          sha256sum dist/DataExpress-Android-debug.apk > dist/SHA256SUMS.txt

      - name: Verify branded all-in-one APK
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/DataExpress-Android-debug.apk
          unzip -l "$APK" | grep -F 'assets/dataexpress/payload.zip'
          unzip -l "$APK" | grep -F 'assets/dataexpress/manifest.json'
          unzip -l "$APK" | grep -F 'assets/dataexpress/demo-database.zip'
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libc++_shared.so'
          unzip -p "$APK" 'lib/arm64-v8a/libzstd-jni-1.5.7-12.so' > /tmp/libzstd-jni.so
          readelf -lW /tmp/libzstd-jni.so | awk '
            / LOAD / { found=1; if ($NF != "0x4000") exit 1 }
            END { if (!found) exit 1 }
          '
          for LIB in libwinlator.so libvirglrenderer.so libvortekrenderer.so libgladiorenderer.so; do
            unzip -p "$APK" "lib/arm64-v8a/$LIB" > "/tmp/$LIB"
            readelf -lW "/tmp/$LIB" | awk -v lib="$LIB" '
              / LOAD / { found=1; if ($NF != "0x4000") { print lib ": bad LOAD alignment " $NF; exit 1 } }
              END { if (!found) exit 1 }
            '
          done
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee dist/APK-BADGING.txt
          grep -Fq "package: name='com.dataexpr'" dist/APK-BADGING.txt
          grep -Fq "versionName='0.1.2-winlator-11.1'" dist/APK-BADGING.txt
          grep -Fq "application-label:'DataExpress Android'" dist/APK-BADGING.txt
          grep -Fq "application-label-ru:'DataExpress Android'" dist/APK-BADGING.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DataExpress-Android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 14
