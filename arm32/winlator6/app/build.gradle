apply plugin: 'com.android.application'
android {
    compileSdk 34
    ndkVersion '24.0.8215888'
    defaultConfig {
        applicationId 'ru.mydataexpress.tv32'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 1
        versionName '0.1-tv-arm32-test.1'
        ndk { abiFilters 'armeabi-v7a' }
    }
    buildTypes { debug { minifyEnabled false } }
    externalNativeBuild { cmake { version '3.22.1'; path 'src/main/cpp/CMakeLists.txt' } }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.7-12@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
